[project]
name = "airtype"
version = "2.0.0"
description = "Fast local push-to-talk speech-to-text that gets out of memory when idle"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.7.1; sys_platform == 'linux'",
    "numpy>=1.26.0",
    "platformdirs>=4.4.0",
    "pynput>=1.8.1",
    "pyperclip>=1.9.0",
    # 1.13.6+ wheels bundle libonnxruntime; older ones need a separate onnxruntime
    # install plus a symlink hack we deliberately no longer carry.
    "sherpa-onnx>=1.13.6,<2.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.12.1",
]

[project.scripts]
airtype = "airtype.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
